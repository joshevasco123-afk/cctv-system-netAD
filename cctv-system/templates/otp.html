<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CCTV Monitoring System | Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: white;
            max-width: 420px;
            width: 100%;
            padding: 2.2rem 2rem 2.5rem;
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.03);
            text-align: center;
            border: 1px solid #e9f0e9;
        }

        .login-card h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #1a2e1f;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
        }

        .login-sub {
            color: #5a6e5a;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #e2efe2;
            display: inline-block;
            padding-bottom: 0.25rem;
        }

        .otp-hint {
            color: #7a8e7a;
            font-size: 0.82rem;
            margin-bottom: 2rem;
            margin-top: 0.75rem;
        }

        .otp-hint i {
            margin-right: 5px;
            color: #2e7d32;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c3e2c;
            display: block;
            margin-bottom: 0.5rem;
        }

        .input-group label i {
            margin-right: 8px;
            color: #2e7d32;
            font-size: 0.9rem;
        }

        .otp-input-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .otp-digit {
            width: 52px;
            height: 60px;
            border: 1.5px solid #dee6de;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            color: #1a2e1f;
            outline: none;
            transition: all 0.2s;
            background: white;
        }

        .otp-digit:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.15);
        }

        /* Hidden real input that gets submitted */
        #otp_value {
            display: none;
        }

        .login-btn {
            background: #2e7d32;
            color: white;
            border: none;
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .login-btn:hover {
            background: #1b5e20;
            transform: scale(0.98);
        }

        .back-link {
            display: block;
            margin-top: 1.25rem;
            font-size: 0.82rem;
            color: #5a6e5a;
            text-decoration: none;
        }

        .back-link:hover {
            color: #2e7d32;
            text-decoration: underline;
        }

        .error-msg {
            background: #ffe9e9;
            color: #c62828;
            padding: 0.7rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            margin-top: 1rem;
            border-left: 3px solid #c62828;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-msg.show {
            display: flex;
        }

        .timer {
            font-size: 0.78rem;
            color: #7a8e7a;
            margin-top: 0.75rem;
        }

        .timer span {
            font-weight: 600;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card" id="loginCard">
            <h1>🔐 Verification</h1>
            <div class="login-sub">Two-Factor Authentication</div>
            <p class="otp-hint">
                <i class="fas fa-mobile-alt"></i>
                Enter the 6-digit code from Google Authenticator
            </p>

            <form id="otpForm" action="/verify-otp" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <!-- Hidden field that gets populated by JS before submit -->
                <input type="hidden" name="otp" id="otp_value">

                <!-- 6 individual digit boxes -->
                <div class="otp-input-wrapper">
                    <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="one-time-code" id="d1">
                    <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" id="d2">
                    <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" id="d3">
                    <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" id="d4">
                    <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" id="d5">
                    <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" id="d6">
                </div>

                <div class="timer">Code refreshes in <span id="countdown">30</span>s</div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-shield-alt"></i> Verify Code
                </button>
            </form>

            <a href="/login" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to login
            </a>

            <div class="error-msg {% if error %}show{% endif %}" id="loginError">
                <i class="fas fa-exclamation-circle"></i> Invalid or expired code. Try again.
            </div>
        </div>
    </div>

    <script>
        const digits = ['d1','d2','d3','d4','d5','d6'].map(id => document.getElementById(id));

        // Auto-advance and auto-fill from paste
        digits.forEach((input, i) => {
            input.addEventListener('input', e => {
                // Strip non-numeric
                input.value = input.value.replace(/\D/g, '');
                if (input.value && i < 5) digits[i + 1].focus();
                updateHidden();
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !input.value && i > 0) {
                    digits[i - 1].focus();
                }
            });

            // Handle paste on any digit
            input.addEventListener('paste', e => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                pasted.split('').slice(0, 6).forEach((char, idx) => {
                    if (digits[idx]) digits[idx].value = char;
                });
                const next = Math.min(pasted.length, 5);
                digits[next].focus();
                updateHidden();
            });
        });

        function updateHidden() {
            document.getElementById('otp_value').value = digits.map(d => d.value).join('');
        }

        // Before submit, combine digits into hidden field
        document.getElementById('otpForm').addEventListener('submit', e => {
            updateHidden();
            const code = document.getElementById('otp_value').value;
            if (code.length < 6) {
                e.preventDefault();
                const err = document.getElementById('loginError');
                err.classList.add('show');
                err.querySelector('span') && (err.querySelector('span').textContent = '');
                err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please enter all 6 digits.';
            }
        });

        // 30-second TOTP countdown timer
        function updateCountdown() {
            const seconds = 30 - (Math.floor(Date.now() / 1000) % 30);
            document.getElementById('countdown').textContent = seconds;
            // Pulse red at last 5 seconds
            document.getElementById('countdown').style.color = seconds <= 5 ? '#c62828' : '#2e7d32';
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Shake on error
        window.addEventListener('DOMContentLoaded', () => {
            const errorDiv = document.getElementById('loginError');
            if (errorDiv.classList.contains('show')) {
                const card = document.getElementById('loginCard');
                card.style.transition = 'transform 0.1s ease';
                card.style.transform = 'translateX(6px)';
                setTimeout(() => card.style.transform = 'translateX(-6px)', 100);
                setTimeout(() => card.style.transform = '', 200);
                digits[0].focus();
            } else {
                digits[0].focus();
            }
        });
    </script>
</body>
</html>
